<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>MOSCLOUD — Штаб группы MOSKBA</title>
  <meta name="theme-color" content="#09090b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MOSCLOUD">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #09090b;
      color: #f5f5f7;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    #loader {
      position: fixed;
      inset: 0;
      background: #09090b;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      z-index: 10;
      transition: opacity 0.25s ease;
    }
    #loader.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 0.08em;
    }
    .dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #e5262b;
      box-shadow: 0 0 14px #e5262b;
      animation: pulse 1.2s infinite ease-in-out;
    }
    .sub {
      font-size: 12.5px;
      color: #a1a1aa;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.25); opacity: 0.65; }
    }
    iframe {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      border: none;
      background: #09090b;
      z-index: 1;
    }
  </style>
  <script>
    (function() {
      var EXEC_URL = "https://script.google.com/macros/s/AKfycbyekszrlL_qvrB5qQOnLxgPZKK2feGgOXio889fS70DUqK-6rPjADgRgz_R4XOnLeko8A/exec";
      var qs = window.location.search || "";
      if (qs.indexOf("ical=1") !== -1 || qs.indexOf("api=1") !== -1) {
        window.location.replace(EXEC_URL + qs);
      }
    })();
  </script>
</head>
<body>
  <div id="loader">
    <div class="brand"><span class="dot"></span><span>MOSCLOUD</span></div>
    <div class="sub">Синхронизация общей базы MOSKBA...</div>
  </div>
  <iframe
    id="appFrame"
    src="https://script.google.com/macros/s/AKfycbyekszrlL_qvrB5qQOnLxgPZKK2feGgOXio889fS70DUqK-6rPjADgRgz_R4XOnLeko8A/exec"
    allow="clipboard-write; fullscreen"
    onload="document.getElementById('loader').classList.add('hidden')">
  </iframe>
</body>
</html>
